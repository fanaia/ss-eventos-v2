name: prepare-update-ooncore-0.3.62

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/update-ooncore-0.3.62' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-ooncore-0.3.62
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Atualizar versão, navegação e contratos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          CORE = '0.3.62'
          CENTRAL = '0.1.9'

          def read(path):
              return json.loads(Path(path).read_text())

          def write(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')

          root = read('package.json')
          root['version'] = CENTRAL
          root['devDependencies']['@oondemand/create-central-oon'] = CORE
          write('package.json', root)

          backend = read('backend/package.json')
          backend['version'] = CENTRAL
          backend['dependencies']['@oondemand/oon-core-back'] = CORE
          write('backend/package.json', backend)

          frontend = read('frontend/package.json')
          frontend['version'] = CENTRAL
          frontend['dependencies']['@oondemand/oon-core-front'] = CORE
          write('frontend/package.json', frontend)

          app = read('central.app.json')
          app['compatibility']['core']['minVersion'] = CORE
          write('central.app.json', app)

          ui = read('frontend/central.ui.json')
          collections = []
          for collection in ui.get('collections', []):
              model = collection.get('model')
              if model in {'Estado', 'Cidade'}:
                  continue
              if model in {'Categoria', 'Responsavel'}:
                  collection['hidden'] = True
              collections.append(collection)
          ui['collections'] = collections
          ui['pages'] = [
              page for page in ui.get('pages', [])
              if page.get('path') not in {'/configuracoes', '/configuracoes/cadastros-auxiliares'}
          ] + [
              {
                  'id': 'configuracoes-home',
                  'path': '/configuracoes',
                  'label': 'Configurações',
                  'title': 'Configurações',
                  'hidden': True,
                  'blocks': [
                      {
                          'type': 'markdown',
                          'content': 'Cadastros auxiliares e integrações utilizadas pela Central SS Eventos.'
                      },
                      {
                          'type': 'navigation.cards',
                          'columns': 2,
                          'cards': [
                              {
                                  'title': 'Cadastros Auxiliares',
                                  'description': 'Categorias, subcategorias e responsáveis utilizados na operação.',
                                  'href': '/configuracoes/cadastros-auxiliares',
                                  'actionLabel': 'Abrir cadastros'
                              },
                              {
                                  'title': 'Integração Omie',
                                  'description': 'Credenciais, sincronizações, webhooks, gatilhos e histórico da integração.',
                                  'href': '/configuracoes/integracao-omie',
                                  'actionLabel': 'Abrir Omie'
                              }
                          ]
                      }
                  ]
              },
              {
                  'id': 'cadastros-auxiliares-home',
                  'path': '/configuracoes/cadastros-auxiliares',
                  'label': 'Cadastros Auxiliares',
                  'title': 'Cadastros Auxiliares',
                  'hidden': True,
                  'blocks': [
                      {
                          'type': 'navigation.cards',
                          'columns': 2,
                          'cards': [
                              {
                                  'title': 'Categorias/Subcategorias',
                                  'description': 'Classificações internas relacionadas às categorias financeiras do Omie.',
                                  'href': '/categorias',
                                  'actionLabel': 'Abrir categorias'
                              },
                              {
                                  'title': 'Responsáveis',
                                  'description': 'Responsáveis operacionais e financeiros dos projetos e pagamentos.',
                                  'href': '/responsaveis',
                                  'actionLabel': 'Abrir responsáveis'
                              }
                          ]
                      }
                  ]
              }
          ]
          write('frontend/central.ui.json', ui)

          for raw in [
              'scripts/validate-manifests.mjs',
              'backend/test/manifest-parity.test.js',
              'backend/test/runtime-version-contract.test.js',
              'README.md',
          ]:
              path = Path(raw)
              path.write_text(path.read_text().replace('0.3.61', CORE).replace('0.1.8', CENTRAL))

          validator = Path('scripts/validate-manifests.mjs')
          text = validator.read_text().replace(
              'expectedModels.filter((name) => !["ProjetoItem", "Pagamento"].includes(name))',
              'expectedModels.filter((name) => !["ProjetoItem", "Pagamento", "Estado", "Cidade"].includes(name))',
          )
          validator.write_text(text)

          parity = Path('backend/test/manifest-parity.test.js')
          text = parity.read_text().replace(
              'expected.filter((name) => !["ProjetoItem", "Pagamento"].includes(name)).sort(),',
              'expected.filter((name) => !["ProjetoItem", "Pagamento", "Estado", "Cidade"].includes(name)).sort(),',
          )
          marker = 'test("não incorpora models técnicos da integração", () => {'
          test = '''test("configurações usam Home sem poluir o menu lateral", () => {\n  const categoria = ui.collections.find((view) => view.model === "Categoria");\n  const responsavel = ui.collections.find((view) => view.model === "Responsavel");\n  assert.equal(categoria.hidden, true);\n  assert.equal(responsavel.hidden, true);\n  assert.equal(ui.collections.some((view) => view.model === "Estado"), false);\n  assert.equal(ui.collections.some((view) => view.model === "Cidade"), false);\n  const settings = ui.pages.find((page) => page.path === "/configuracoes");\n  const auxiliaries = ui.pages.find((page) => page.path === "/configuracoes/cadastros-auxiliares");\n  assert.equal(settings.hidden, true);\n  assert.equal(auxiliaries.hidden, true);\n  assert.deepEqual(settings.blocks.find((block) => block.type === "navigation.cards").cards.map((card) => card.href), [\n    "/configuracoes/cadastros-auxiliares",\n    "/configuracoes/integracao-omie",\n  ]);\n  assert.deepEqual(auxiliaries.blocks.find((block) => block.type === "navigation.cards").cards.map((card) => card.href), [\n    "/categorias",\n    "/responsaveis",\n  ]);\n});\n\n'''
          if test not in text:
              text = text.replace(marker, test + marker)
          parity.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          if '## Home de Configurações' not in text:
              text += '''\n## Home de Configurações\n\nA engrenagem abre `/configuracoes`, com acessos a Cadastros Auxiliares e Integração Omie sem criar seções de Configurações ou Integrações no menu lateral. Categorias/Subcategorias e Responsáveis permanecem acessíveis pela Home de Cadastros Auxiliares. Estados e Cidades são apenas models internas de referência.\n\nA página Omie do OonCore `0.3.62` separa Configurações, Sincronização, Webhooks/Gatilhos e Histórico. O link público do webhook pode ser copiado, e o token é gerado e rotacionado pelo Core.\n'''
          readme.write_text(text)
          PY

      - name: Regenerar lockfiles e instalar
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Sincronizar documentação e validar
        shell: bash
        run: |
          set -euo pipefail
          npm run ooncore:docs
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend
          node - <<'NODE'
          const fs = require('node:fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const root = read('package.json');
          const backend = read('backend/package.json');
          const frontend = read('frontend/package.json');
          const app = read('central.app.json');
          const ui = read('frontend/central.ui.json');
          const expected = '0.3.62';
          if (root.devDependencies['@oondemand/create-central-oon'] !== expected) throw new Error('Gerador desalinhado.');
          if (backend.dependencies['@oondemand/oon-core-back'] !== expected) throw new Error('Backend desalinhado.');
          if (frontend.dependencies['@oondemand/oon-core-front'] !== expected) throw new Error('Frontend desalinhado.');
          if (app.compatibility.core.minVersion !== expected) throw new Error('Manifesto desalinhado.');
          if (ui.collections.some((view) => ['Estado', 'Cidade'].includes(view.model))) throw new Error('Localidades expostas.');
          for (const model of ['Categoria', 'Responsavel']) {
            if (ui.collections.find((view) => view.model === model)?.hidden !== true) throw new Error(`${model} visível.`);
          }
          if (!ui.pages.find((page) => page.path === '/configuracoes')) throw new Error('Home ausente.');
          const built = fs.readFileSync('frontend/node_modules/@oondemand/oon-core-front/dist/index.js', 'utf8');
          for (const value of ['/configuracoes/integracao-omie', 'Webhooks/Gatilhos', 'Gerar novo token', 'Copiar link']) {
            if (!built.includes(value)) throw new Error(`Contrato ausente: ${value}`);
          }
          NODE

      - name: Remover preparação e gravar atualização
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-update-ooncore-0.3.62.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: atualizar configurações e Omie para OonCore 0.3.62"
          git push origin HEAD:agent/update-ooncore-0.3.62
