name: patch-payment-balance-validator

on:
  pull_request:

permissions:
  contents: read

jobs:
  patch:
    if: github.head_ref == 'fix/optional-location-payment-balance'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: fix/optional-location-payment-balance
          fetch-depth: 0

      - name: Align validator
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/validate-manifests.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const before = '  valor: "pagamentoValorPendente",';
          const after = '  valor: "pagamentoSaldoPlanejamento",';
          if (!source.includes(after)) {
            if (!source.includes(before)) throw new Error('Trecho de herança do pagamento não encontrado.');
            fs.writeFileSync(path, source.replace(before, after));
          }
          NODE

          git fetch origin main
          git checkout origin/main -- .github/workflows/patch-payment-balance-validator.yml || rm -f .github/workflows/patch-payment-balance-validator.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi

          git commit -m "test: alinhar herança do saldo a programar"
          git pull --rebase origin fix/optional-location-payment-balance
          git push origin HEAD:fix/optional-location-payment-balance
