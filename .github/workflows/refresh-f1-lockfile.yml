name: refresh-f1-lockfile

on:
  push:
    branches:
      - agent/f1-central-app-conformance
    paths:
      - ".github/workflows/refresh-f1-lockfile.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-f1-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'agent/f1-central-app-conformance' || github.ref == 'refs/heads/agent/f1-central-app-conformance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/f1-central-app-conformance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Replace release-candidate integrity with published integrity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'frontend/package-lock.json';
          const candidate = 'sha512-uq/mA7NT9y6bq/3omVYlT7WShuzjOgFzjdk34UMROkoBBgwLiSmuKU9urgE4snXYYTp421+4zVcVQy3BdLUYqw==';
          const published = 'sha512-SCxGVBIT+9ZDzyjOiufzvI+XtkLzr57DHwSwfJ604dedx6sLteHpCUiRd2Ez5dm0K8D+KQsZjzyk3GwXxprRDw==';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes(candidate)) throw new Error('Integridade candidata não encontrada no lockfile.');
          fs.writeFileSync(file, source.replace(candidate, published));
          NODE

      - name: Verify reproducible frontend install
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Commit refreshed lockfile and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-f1-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/refresh-f1-lockfile.yml
          git commit -m "chore: refresh published npm integrity"
          git push origin HEAD:agent/f1-central-app-conformance
