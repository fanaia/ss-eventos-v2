name: prepare-f6-omie

on:
  push:
    branches:
      - agent/f6-consume-omie-0.3.58
    paths:
      - scripts/prepare-f6-omie-v2.mjs
      - scripts/run-prepare-f6-v2.mjs
      - .github/workflows/prepare-f6-omie.yml
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prepare-f6-omie
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'push' || github.head_ref == 'agent/f6-consume-omie-0.3.58'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/f6-consume-omie-0.3.58
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Apply conformant F6 changes
        run: node scripts/run-prepare-f6-v2.mjs

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate backend lockfile
        run: npm install --prefix backend --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate frontend lockfile
        run: npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install published root toolchain
        run: npm install --no-audit --no-fund

      - name: Sync OonCore documentation
        run: npm run ooncore:docs

      - name: Validate static contracts
        run: node scripts/validate-manifests.mjs

      - name: Validate baseline and conformance
        run: npm run check

      - name: Install and test backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm test --prefix backend

      - name: Install and build frontend
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend

      - name: Remove temporary preparation files
        run: |
          rm -f scripts/prepare-f6-omie.mjs
          rm -f scripts/run-prepare-f6.mjs
          rm -f scripts/prepare-f6-omie-v2.mjs
          rm -f scripts/run-prepare-f6-v2.mjs
          rm -f .github/workflows/prepare-f6-omie.yml

      - name: Commit generated consumer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: consumir infraestrutura Omie nativa do OonCore 0.3.58"
          git push origin HEAD:agent/f6-consume-omie-0.3.58
