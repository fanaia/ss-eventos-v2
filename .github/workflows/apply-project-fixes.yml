name: apply-project-fixes

on:
  push:
    branches:
      - fix/project-create-and-contact-validation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/project-create-and-contact-validation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Wait for coordinated OonCore release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if npm view @oondemand/create-central-oon@0.3.49 version >/dev/null 2>&1 \
              && npm view @oondemand/oon-core-back@0.3.49 version >/dev/null 2>&1 \
              && npm view @oondemand/oon-core-front@0.3.49 version >/dev/null 2>&1; then
              echo "OonCore 0.3.49 disponível."
              exit 0
            fi
            echo "Aguardando publicação do OonCore 0.3.49 (${attempt}/90)..."
            sleep 10
          done
          echo "OonCore 0.3.49 não foi publicado dentro do tempo esperado." >&2
          exit 1

      - name: Update coordinated dependencies and compatibility
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          function read(path) {
            return JSON.parse(fs.readFileSync(path, "utf8"));
          }

          function write(path, json) {
            fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          }

          const rootPackage = read("package.json");
          rootPackage.devDependencies["@oondemand/create-central-oon"] = "0.3.49";
          write("package.json", rootPackage);

          const backendPackage = read("backend/package.json");
          backendPackage.dependencies["@oondemand/oon-core-back"] = "0.3.49";
          write("backend/package.json", backendPackage);

          const frontendPackage = read("frontend/package.json");
          frontendPackage.dependencies["@oondemand/oon-core-front"] = "0.3.49";
          write("frontend/package.json", frontendPackage);

          const app = read("central.app.json");
          app.compatibility.core.minVersion = "0.3.49";
          write("central.app.json", app);

          const validatorPath = "scripts/validate-manifests.mjs";
          const validator = fs.readFileSync(validatorPath, "utf8")
            .replace('const expectedVersion = "0.3.47";', 'const expectedVersion = "0.3.49";');
          fs.writeFileSync(validatorPath, validator);
          NODE

      - name: Refresh lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend

      - name: Synchronize OonCore documentation
        shell: bash
        run: |
          set -euo pipefail
          npm run ooncore:docs

      - name: Validate manifests and builds
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend

      - name: Commit generated update
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-project-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json central.app.json scripts/validate-manifests.mjs backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json .ooncore .github/workflows/apply-project-fixes.yml
          git commit -m "fix: atualizar OonCore para corrigir criação de projetos"
          git push origin HEAD:fix/project-create-and-contact-validation
