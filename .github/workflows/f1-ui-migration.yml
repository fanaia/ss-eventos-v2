name: f1-ui-migration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/f1-ui-migration.yml"
      - "scripts/apply-f1-ui-migration.mjs"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/f1-central-app-conformance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/f1-central-app-conformance
          fetch-depth: 0

      - name: Move payment creation into central.ui.json
        run: node scripts/apply-f1-ui-migration.mjs
