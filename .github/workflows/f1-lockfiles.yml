name: f1-lockfiles

on:
  push:
    branches:
      - agent/f1-central-app-conformance
    paths:
      - ".github/workflows/f1-lockfiles.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/f1-central-app-conformance
          fetch-depth: 0

      - name: Apply deterministic package locks
        run: node scripts/apply-f1-lockfiles.mjs
