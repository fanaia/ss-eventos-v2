name: apply-multitab-draft-release
on:
  push:
    branches: [fix/persist-multitab-form-draft]
    paths: [.github/trigger-multitab-draft-release]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-multitab-form-draft
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Wait for OonCore 0.3.50
        run: |
          for attempt in $(seq 1 120); do
            npm view @oondemand/create-central-oon@0.3.50 version >/dev/null 2>&1 \
              && npm view @oondemand/oon-core-back@0.3.50 version >/dev/null 2>&1 \
              && npm view @oondemand/oon-core-front@0.3.50 version >/dev/null 2>&1 \
              && exit 0
            sleep 10
          done
          exit 1
      - name: Update versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const update = (path, section, name) => {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            json[section][name] = '0.3.50';
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          };
          update('package.json', 'devDependencies', '@oondemand/create-central-oon');
          update('backend/package.json', 'dependencies', '@oondemand/oon-core-back');
          update('frontend/package.json', 'dependencies', '@oondemand/oon-core-front');
          const app = JSON.parse(fs.readFileSync('central.app.json', 'utf8'));
          app.compatibility.core.minVersion = '0.3.50';
          fs.writeFileSync('central.app.json', JSON.stringify(app, null, 2) + '\n');
          const validatorPath = 'scripts/validate-manifests.mjs';
          const validator = fs.readFileSync(validatorPath, 'utf8').replace('const expectedVersion = "0.3.49";', 'const expectedVersion = "0.3.50";');
          if (!validator.includes('const expectedVersion = "0.3.50";')) throw new Error('expectedVersion não atualizado');
          fs.writeFileSync(validatorPath, validator);
          NODE
      - name: Refresh and validate
        run: |
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend
          npm install --ignore-scripts --package-lock=false
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend
          npm run ooncore:docs
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend
      - name: Commit update
        run: |
          rm .github/workflows/apply-multitab-draft-release.yml .github/trigger-multitab-draft-release
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: atualizar OonCore para preservar dados entre abas"
          git push origin HEAD:fix/persist-multitab-form-draft
