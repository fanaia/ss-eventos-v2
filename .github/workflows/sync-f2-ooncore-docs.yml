name: sync-f2-ooncore-docs

on:
  push:
    branches:
      - agent/f2-process-manifest
    paths:
      - package.json
      - .github/workflows/sync-f2-ooncore-docs.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/f2-process-manifest
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install published toolchain
        run: npm install --no-audit --no-fund

      - name: Synchronize OonCore documentation
        run: npm run ooncore:docs

      - name: Commit synchronized documentation
        shell: bash
        run: |
          if git diff --quiet -- .ooncore; then
            echo "Documentation already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ooncore
          git commit -m "Sincronizar documentação OonCore 0.3.47"
          git push origin HEAD:agent/f2-process-manifest
