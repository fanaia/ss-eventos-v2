name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate app, domain, process and UI manifests
        run: node scripts/validate-manifests.mjs

      - name: Check backend extension boundary
        run: node -e "require('./backend/central.config.js')"

  published-baseline:
    needs: static-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install published root baseline
        run: npm install @oondemand/create-central-oon@0.3.45 --no-save --package-lock=false --no-audit --no-fund

      - name: Validate OonCore documentation baseline
        run: npm run ooncore:docs:check

      - name: Validate manifests and reference baseline
        run: |
          npm run check:manifests
          npm run baseline:check

      - name: Install published backend baseline
        run: npm install @oondemand/oon-core-back@0.3.45 --prefix backend --no-save --package-lock=false --no-audit --no-fund

      - name: Test backend-specific rules
        run: npm test --prefix backend

      - name: Install published frontend baseline
        run: npm install @oondemand/oon-core-front@0.3.45 --prefix frontend --no-save --package-lock=false --no-audit --no-fund

      - name: Build frontend baseline
        run: npm run build --prefix frontend
