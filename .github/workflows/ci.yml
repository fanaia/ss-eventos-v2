name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - fix/persist-multitab-form-draft

permissions:
  contents: read

jobs:
  apply-multitab-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/persist-multitab-form-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/persist-multitab-form-draft
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Update, validate and commit OonCore 0.3.50
        shell: bash
        run: |
          set -euo pipefail

          current=$(node -p "require('./frontend/package.json').dependencies['@oondemand/oon-core-front']")
          if [[ "$current" == "0.3.50" ]]; then
            echo "A branch já usa OonCore 0.3.50."
            exit 0
          fi

          for attempt in $(seq 1 60); do
            if [[ "$(npm view @oondemand/create-central-oon@0.3.50 version 2>/dev/null || true)" == "0.3.50" ]] \
              && [[ "$(npm view @oondemand/oon-core-back@0.3.50 version 2>/dev/null || true)" == "0.3.50" ]] \
              && [[ "$(npm view @oondemand/oon-core-front@0.3.50 version 2>/dev/null || true)" == "0.3.50" ]]; then
              break
            fi
            [[ "$attempt" -lt 60 ]] || { echo "OonCore 0.3.50 não está disponível no npm." >&2; exit 1; }
            sleep 10
          done

          node <<'NODE'
          const fs = require('node:fs');
          const update = (path, section, name) => {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            json[section][name] = '0.3.50';
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          };
          update('package.json', 'devDependencies', '@oondemand/create-central-oon');
          update('backend/package.json', 'dependencies', '@oondemand/oon-core-back');
          update('frontend/package.json', 'dependencies', '@oondemand/oon-core-front');

          const app = JSON.parse(fs.readFileSync('central.app.json', 'utf8'));
          app.compatibility.core.minVersion = '0.3.50';
          fs.writeFileSync('central.app.json', JSON.stringify(app, null, 2) + '\n');

          const validatorPath = 'scripts/validate-manifests.mjs';
          const validator = fs.readFileSync(validatorPath, 'utf8')
            .replace('const expectedVersion = "0.3.49";', 'const expectedVersion = "0.3.50";');
          if (!validator.includes('const expectedVersion = "0.3.50";')) {
            throw new Error('Não foi possível atualizar expectedVersion para 0.3.50.');
          }
          fs.writeFileSync(validatorPath, validator);
          NODE

          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend
          npm install --ignore-scripts --package-lock=false
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend
          npm run ooncore:docs
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend

          rm -f .github/workflows/apply-multitab-draft-release.yml
          rm -f .github/trigger-multitab-draft-release
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: atualizar OonCore para preservar dados entre abas"
          git push origin HEAD:fix/persist-multitab-form-draft

  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate app, domain, process and UI manifests
        run: node scripts/validate-manifests.mjs

      - name: Check backend extension boundary
        run: node -e "require('./backend/central.config.js')"

  central:
    needs: static-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install published root toolchain
        run: npm install --no-audit --no-fund

      - name: Validate OonCore documentation
        run: npm run ooncore:docs:check

      - name: Validate manifests, baseline and conformance
        run: npm run check

      - name: Install backend reproducibly
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Test backend domain
        run: npm test --prefix backend

      - name: Install frontend reproducibly
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Build frontend
        run: npm run build --prefix frontend
