name: apply-ooncore-0.3.54

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'fix/update-ooncore-0.3.54-error-details'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: fix/update-ooncore-0.3.54-error-details
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Update Central and validate
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          function updateJson(path, update) {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            update(payload);
            fs.writeFileSync(path, `${JSON.stringify(payload, null, 2)}\n`);
          }

          updateJson('package.json', (payload) => {
            payload.version = '0.1.2';
            payload.devDependencies['@oondemand/create-central-oon'] = '0.3.54';
          });
          updateJson('backend/package.json', (payload) => {
            payload.version = '0.1.2';
            payload.dependencies['@oondemand/oon-core-back'] = '0.3.54';
          });
          updateJson('frontend/package.json', (payload) => {
            payload.version = '0.1.2';
            payload.dependencies['@oondemand/oon-core-front'] = '0.3.54';
          });
          updateJson('central.app.json', (payload) => {
            payload.compatibility.core.minVersion = '0.3.54';
          });

          for (const path of [
            'scripts/validate-manifests.mjs',
            'backend/test/manifest-parity.test.js',
          ]) {
            const source = fs.readFileSync(path, 'utf8').replaceAll('0.3.53', '0.3.54');
            fs.writeFileSync(path, source);
          }

          const envPath = 'backend/.env.example';
          const env = fs.readFileSync(envPath, 'utf8').replace(/SERVICE_VERSION=.*/, 'SERVICE_VERSION=0.1.2');
          fs.writeFileSync(envPath, env);
          NODE

          npm install --no-audit --no-fund
          npm install --prefix backend --no-audit --no-fund
          npm install --prefix frontend --no-audit --no-fund
          npm run ooncore:docs
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend

          git fetch origin main
          git checkout origin/main -- .github/workflows/apply-ooncore-0.3.54.yml || rm -f .github/workflows/apply-ooncore-0.3.54.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi

          git commit -m "fix: atualizar OonCore para 0.3.54"
          git pull --rebase origin fix/update-ooncore-0.3.54-error-details
          git push origin HEAD:fix/update-ooncore-0.3.54-error-details
