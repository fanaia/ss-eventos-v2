name: refresh-f2-lockfiles

on:
  push:
    branches:
      - agent/f2-process-manifest
    paths:
      - package.json
      - backend/package.json
      - frontend/package.json
      - .github/workflows/refresh-f2-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/f2-process-manifest
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Regenerate backend lockfile
        run: npm install --package-lock-only --prefix backend --no-audit --no-fund --ignore-scripts

      - name: Regenerate frontend lockfile
        run: npm install --package-lock-only --prefix frontend --no-audit --no-fund --ignore-scripts

      - name: Commit regenerated lockfiles
        shell: bash
        run: |
          if git diff --quiet -- backend/package-lock.json frontend/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          git commit -m "Atualizar lockfiles para OonCore 0.3.47"
          git push origin HEAD:agent/f2-process-manifest
