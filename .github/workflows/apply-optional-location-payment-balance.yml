name: apply-optional-location-payment-balance

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'fix/optional-location-payment-balance'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: fix/optional-location-payment-balance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update Central and validate
        shell: bash
        run: |
          set -euo pipefail

          version="0.3.56"
          for attempt in $(seq 1 48); do
            front=$(npm view "@oondemand/oon-core-front@${version}" version 2>/dev/null || true)
            back=$(npm view "@oondemand/oon-core-back@${version}" version 2>/dev/null || true)
            generator=$(npm view "@oondemand/create-central-oon@${version}" version 2>/dev/null || true)
            if [[ "$front" == "$version" && "$back" == "$version" && "$generator" == "$version" ]]; then
              echo "OonCore ${version} disponível no npm."
              break
            fi
            if [[ "$attempt" == "48" ]]; then
              echo "OonCore ${version} não ficou disponível no npm." >&2
              exit 1
            fi
            echo "Aguardando publicação do OonCore ${version} (${attempt}/48)..."
            sleep 5
          done

          node <<'NODE'
          const fs = require('node:fs');

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }

          function writeJson(path, payload) {
            fs.writeFileSync(path, `${JSON.stringify(payload, null, 2)}\n`);
          }

          function replaceAll(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) return;
            fs.writeFileSync(path, source.split(before).join(after));
          }

          const domain = readJson('backend/central.domain.json');
          const processManifest = readJson('backend/central.process.json');
          const ui = readJson('frontend/central.ui.json');
          const app = readJson('central.app.json');
          const rootPackage = readJson('package.json');
          const backendPackage = readJson('backend/package.json');
          const frontendPackage = readJson('frontend/package.json');

          const item = domain.models.find((model) => model.name === 'ProjetoItem');
          if (!item) throw new Error('Model ProjetoItem não encontrada.');
          delete item.fields.estadoId.required;
          delete item.fields.cidadeId.required;
          item.fields.pagamentoSaldoPlanejamento = {
            kind: 'currency',
            label: 'Saldo a programar',
            default: 0,
          };

          const itemRules = processManifest.models.ProjetoItem;
          for (const field of ['estadoId', 'cidadeId']) {
            const reference = itemRules.references.find((entry) => entry.field === field);
            if (!reference) throw new Error(`Referência ${field} não encontrada.`);
            reference.required = false;
          }

          if (!itemRules.bindings.some((binding) => binding.field === 'pagamentoSaldoPlanejamento')) {
            const plannedIndex = itemRules.bindings.findIndex((binding) => binding.field === 'pagamentoTotalPlanejado');
            const balanceBinding = {
              field: 'pagamentoSaldoPlanejamento',
              kind: 'expression',
              precision: 2,
              expression: {
                op: 'max',
                args: [
                  { value: 0 },
                  {
                    op: 'subtract',
                    args: [
                      { field: 'contratacaoTotal' },
                      { field: 'pagamentoTotalPlanejado' },
                    ],
                  },
                ],
              },
            };
            itemRules.bindings.splice(plannedIndex + 1, 0, balanceBinding);
          }

          const itemPipeline = ui.pipelines.find((pipeline) => pipeline.model === 'ProjetoItem');
          if (!itemPipeline) throw new Error('Esteira ProjetoItem não encontrada.');
          if (!itemPipeline.form.some((field) => field.field === 'pagamentoSaldoPlanejamento')) {
            const plannedIndex = itemPipeline.form.findIndex((field) => field.field === 'pagamentoTotalPlanejado');
            itemPipeline.form.splice(plannedIndex + 1, 0, {
              field: 'pagamentoSaldoPlanejamento',
              readonly: true,
            });
          }

          const paymentTab = itemPipeline.ticketModal.tabs.find((tab) => tab.id === 'pagamento');
          if (!paymentTab?.create?.initialValuesFromParent) throw new Error('Configuração de criação de pagamento ausente.');
          paymentTab.create.initialValuesFromParent.valor = 'pagamentoSaldoPlanejamento';

          const resultGroup = itemPipeline.ticketModal.tabs
            .find((tab) => tab.id === 'fechamento')
            ?.groups?.find((group) => group.label === 'Resultado');
          if (resultGroup && !resultGroup.fields.includes('pagamentoSaldoPlanejamento')) {
            const plannedIndex = resultGroup.fields.indexOf('pagamentoTotalPlanejado');
            resultGroup.fields.splice(plannedIndex + 1, 0, 'pagamentoSaldoPlanejamento');
          }

          const centralVersion = '0.1.4';
          const coreVersion = '0.3.56';
          rootPackage.version = centralVersion;
          backendPackage.version = centralVersion;
          frontendPackage.version = centralVersion;
          rootPackage.devDependencies['@oondemand/create-central-oon'] = coreVersion;
          backendPackage.dependencies['@oondemand/oon-core-back'] = coreVersion;
          frontendPackage.dependencies['@oondemand/oon-core-front'] = coreVersion;
          app.compatibility.core.minVersion = coreVersion;

          writeJson('backend/central.domain.json', domain);
          writeJson('backend/central.process.json', processManifest);
          writeJson('frontend/central.ui.json', ui);
          writeJson('central.app.json', app);
          writeJson('package.json', rootPackage);
          writeJson('backend/package.json', backendPackage);
          writeJson('frontend/package.json', frontendPackage);

          replaceAll('scripts/validate-manifests.mjs', '0.3.55', coreVersion);
          replaceAll('backend/test/runtime-version-contract.test.js', '0.1.3', centralVersion);
          replaceAll('backend/test/runtime-version-contract.test.js', '0.3.55', coreVersion);
          replaceAll('backend/test/manifest-parity.test.js', '0.3.55', coreVersion);

          const parityPath = 'backend/test/manifest-parity.test.js';
          let parity = fs.readFileSync(parityPath, 'utf8');
          if (!parity.includes('saldo restante para programar novos pagamentos')) {
            parity += `\n\ntest("localização opcional também é respeitada nas regras e o novo pagamento usa o saldo a programar", () => {\n  const references = processManifest.models.ProjetoItem.references;\n  assert.equal(references.find((reference) => reference.field === "estadoId").required, false);\n  assert.equal(references.find((reference) => reference.field === "cidadeId").required, false);\n\n  const item = domain.models.find((model) => model.name === "ProjetoItem");\n  assert.equal(item.fields.pagamentoSaldoPlanejamento.label, "Saldo a programar");\n\n  const binding = processManifest.models.ProjetoItem.bindings\n    .find((entry) => entry.field === "pagamentoSaldoPlanejamento");\n  assert.equal(binding.kind, "expression");\n  assert.equal(binding.expression.op, "max");\n\n  const pipeline = ui.pipelines.find((view) => view.model === "ProjetoItem");\n  const paymentTab = pipeline.ticketModal.tabs.find((tab) => tab.id === "pagamento");\n  assert.equal(\n    paymentTab.create.initialValuesFromParent.valor,\n    "pagamentoSaldoPlanejamento",\n    "o valor inicial deve usar o saldo restante para programar novos pagamentos",\n  );\n});\n`;
            fs.writeFileSync(parityPath, parity);
          }
          NODE

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend
          npm ci --silent
          npm ci --silent --prefix backend
          npm ci --silent --prefix frontend
          npm run ooncore:docs
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend

          git fetch origin main
          git checkout origin/main -- .github/workflows/apply-optional-location-payment-balance.yml || rm -f .github/workflows/apply-optional-location-payment-balance.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi

          git commit -m "fix: tornar localização opcional e calcular saldo de pagamento"
          git pull --rebase origin fix/optional-location-payment-balance
          git push origin HEAD:fix/optional-location-payment-balance
