name: prepare-update-ooncore-0.3.60

on:
  push:
    branches: [agent/update-ooncore-0.3.60]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-ooncore-0.3.60
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Atualizar contratos coordenados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('package.json'),
              Path('backend/package.json'),
              Path('frontend/package.json'),
              Path('central.app.json'),
              Path('scripts/validate-manifests.mjs'),
              Path('backend/test/manifest-parity.test.js'),
              Path('backend/test/runtime-version-contract.test.js'),
              Path('README.md'),
          ]

          for path in files:
              text = path.read_text()
              text = text.replace('0.3.59', '0.3.60')
              if path in {
                  Path('package.json'),
                  Path('backend/package.json'),
                  Path('frontend/package.json'),
                  Path('backend/test/runtime-version-contract.test.js'),
              }:
                  text = text.replace('0.1.6', '0.1.7')
              path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          old = (
              'No OonCore `0.3.60`, a engrenagem no header direciona para a configuração da Central e, '
              'na ausência de uma página própria, abre `/integracoes`. As capabilities arquiteturais do '
              'aplicativo são avaliadas separadamente das permissões RBAC do usuário, permitindo acessar '
              'a configuração e o teste do Omie sem duplicar a capability no token.'
          )
          new = old + (
              ' A versão também corrige a persistência das credenciais Omie em ambientes publicados, '
              'reutilizando `INSTANCE_CREDENTIAL_ENCRYPTION_KEY`, e apresenta na interface o diagnóstico '
              'sanitizado devolvido pelo backend.'
          )
          if old not in text:
              raise SystemExit('Parágrafo de versão do README não encontrado.')
          readme.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerar lockfiles publicados
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Instalar de forma reproduzível
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Sincronizar documentação do OonCore
        run: npm run ooncore:docs
      - name: Validar Central consumidora
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend
          node - <<'NODE'
          const fs = require('node:fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const root = read('package.json');
          const backend = read('backend/package.json');
          const frontend = read('frontend/package.json');
          const app = read('central.app.json');
          const expected = '0.3.60';
          if (root.devDependencies['@oondemand/create-central-oon'] !== expected) throw new Error('Gerador desalinhado.');
          if (backend.dependencies['@oondemand/oon-core-back'] !== expected) throw new Error('Backend desalinhado.');
          if (frontend.dependencies['@oondemand/oon-core-front'] !== expected) throw new Error('Frontend desalinhado.');
          if (app.compatibility.core.minVersion !== expected) throw new Error('Manifesto desalinhado.');
          if (root.version !== '0.1.7' || backend.version !== '0.1.7' || frontend.version !== '0.1.7') {
            throw new Error('Versão da Central desalinhada.');
          }
          NODE
      - name: Remover preparação e gravar atualização
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-update-ooncore-0.3.60.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: atualizar SS Eventos V2 para OonCore 0.3.60"
          git push origin HEAD:agent/update-ooncore-0.3.60
