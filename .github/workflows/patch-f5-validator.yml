name: patch-f5-validator

on:
  push:
    branches:
      - agent/f5-consume-integration-engine
    paths:
      - .github/workflows/patch-f5-validator.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/f5-consume-integration-engine

      - name: Update F5 manifest contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-manifests.mjs')
          source = path.read_text()
          old = '''if (app.modules?.integrations !== false || app.modules?.omie !== false) {
            fail("Integrações e Omie devem continuar desabilitados até a abstração no OonCore.");
          }'''
          new = '''if (app.modules?.integrations !== true) {
            fail("SS Eventos V2 deve habilitar a engine nativa de integrações do OonCore.");
          }
          if (app.modules?.omie !== false) {
            fail("O adaptador Omie deve permanecer desabilitado até a Fase 6.");
          }'''
          if old not in source:
              raise SystemExit('Bloco legado de integrações não encontrado.')
          source = source.replace(old, new)
          source = source.replace(
              '  "core.pipelines",\n  "domain.computed-fields",',
              '  "core.pipelines",\n  "core.integrations",\n  "domain.computed-fields",',
          )
          source = source.replace('const expectedVersion = "0.3.56";', 'const expectedVersion = "0.3.57";')
          path.write_text(source)
          PY

      - name: Commit validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-manifests.mjs
          git commit -m "test(v2): validar engine nativa da F5"
          git push origin HEAD:agent/f5-consume-integration-engine
