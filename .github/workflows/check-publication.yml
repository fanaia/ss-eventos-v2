name: check-publication

on:
  push:
    branches:
      - agent/corrigir-lockfiles-publicacao
    paths:
      - .github/workflows/check-publication.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect recent workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/tmp
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/oondemand/central-ativacao/actions/runs?per_page=20' \
            > .github/tmp/central-ativacao-runs.json
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/fanaia/ss-eventos-v2/actions/runs?per_page=20' \
            > .github/tmp/ss-eventos-v2-runs.json

      - name: Commit collected status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/*.json
          git commit -m "ops: registrar status temporário da publicação"
          git push origin "HEAD:${GITHUB_REF_NAME}"
