name: check-publication

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect SS Eventos V2 workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p status

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" \
            | jq '{workflow_runs: [.workflow_runs[] | {id, name, path, status, conclusion, event, run_number, created_at, updated_at, head_branch, head_sha, html_url}]}' \
            > status/ss-eventos-v2-runs.json

      - name: Upload publication status
        uses: actions/upload-artifact@v4
        with:
          name: publication-status
          path: status
          retention-days: 1
