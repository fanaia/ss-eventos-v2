name: check-publication

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect recent workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/oondemand/central-ativacao/actions/runs?per_page=30' \
            | jq '{workflow_runs: [.workflow_runs[] | {id, name, path, status, conclusion, event, run_number, created_at, updated_at, head_branch, head_sha, html_url}]}' \
            > status/central-ativacao-runs.json

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/fanaia/ss-eventos-v2/actions/runs?per_page=30' \
            | jq '{workflow_runs: [.workflow_runs[] | {id, name, path, status, conclusion, event, run_number, created_at, updated_at, head_branch, head_sha, html_url}]}' \
            > status/ss-eventos-v2-runs.json

      - name: Upload publication status
        uses: actions/upload-artifact@v4
        with:
          name: publication-status
          path: status
          retention-days: 1
