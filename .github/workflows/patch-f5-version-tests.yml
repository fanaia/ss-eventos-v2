name: patch-f5-version-tests

on:
  push:
    branches:
      - agent/f5-consume-integration-engine
    paths:
      - .github/workflows/patch-f5-version-tests.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/f5-consume-integration-engine

      - name: Update version contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in (
              'backend/test/manifest-parity.test.js',
              'backend/test/runtime-version-contract.test.js',
          ):
              path = Path(filename)
              source = path.read_text()
              if '0.3.56' not in source:
                  raise SystemExit(f'Versão anterior não encontrada em {filename}.')
              path.write_text(source.replace('0.3.56', '0.3.57'))
          PY

      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/test/manifest-parity.test.js backend/test/runtime-version-contract.test.js
          git commit -m "test(v2): alinhar contratos à OonCore 0.3.57"
          git push origin HEAD:agent/f5-consume-integration-engine
