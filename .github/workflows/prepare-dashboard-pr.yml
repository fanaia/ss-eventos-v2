name: prepare-dashboard-pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/update-ooncore-0.3.63-dashboard' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-ooncore-0.3.63-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirmar pacotes publicados
        run: |
          test "$(npm view @oondemand/create-central-oon@0.3.63 version)" = "0.3.63"
          test "$(npm view @oondemand/oon-core-back@0.3.63 version)" = "0.3.63"
          test "$(npm view @oondemand/oon-core-front@0.3.63 version)" = "0.3.63"

      - name: Atualizar Central e Dashboard
        run: python3 scripts/prepare-dashboard-0.3.63.py

      - name: Atualizar contratos internos de versão
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for raw in [
              "scripts/validate-manifests.mjs",
              "backend/test/manifest-parity.test.js",
              "backend/test/runtime-version-contract.test.js",
              "README.md",
              "docs/CONFIGURACOES_OMIE.md",
          ]:
              path = Path(raw)
              text = path.read_text()
              path.write_text(text.replace("0.3.62", "0.3.63"))
          PY

      - name: Regenerar lockfiles oficiais
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend

      - name: Instalar e sincronizar documentação
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend
          npm run ooncore:docs

      - name: Validar Central
        run: |
          npm run check
          npm test --prefix backend
          npm run build --prefix frontend

      - name: Gravar resultado definitivo
        run: |
          rm -f .github/workflows/prepare-dashboard-0.3.63.yml
          rm -f .github/workflows/prepare-dashboard-pr.yml
          rm -f scripts/prepare-dashboard-0.3.63.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: adicionar Dashboard inicial com OonCore 0.3.63"
          git push origin HEAD:agent/update-ooncore-0.3.63-dashboard
