name: prepare-ooncore-0.3.59

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prepare-ooncore-0.3.59
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'agent/update-ooncore-0.3.59'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-ooncore-0.3.59
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Apply version update
        run: node scripts/prepare-ooncore-0.3.59.mjs

      - name: Regenerate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix backend --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install published toolchain
        run: npm install --no-audit --no-fund

      - name: Sync OonCore documentation
        run: npm run ooncore:docs

      - name: Validate manifests, baseline and conformance
        run: npm run check

      - name: Test backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm test --prefix backend

      - name: Build frontend
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend

      - name: Remove temporary preparation files
        run: |
          rm -f scripts/prepare-ooncore-0.3.59.mjs
          rm -f .github/workflows/prepare-ooncore-0.3.59.yml

      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: atualizar SS Eventos V2 para OonCore 0.3.59"
          git push origin HEAD:agent/update-ooncore-0.3.59
