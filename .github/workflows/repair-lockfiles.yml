name: repair-lockfiles

on:
  push:
    branches:
      - agent/corrigir-lockfiles-publicacao
    paths:
      - .github/workflows/repair-lockfiles.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Regenerate backend lockfile
        run: npm install --prefix backend --no-audit --no-fund

      - name: Validate backend clean install
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Test backend
        run: npm test --prefix backend

      - name: Regenerate frontend lockfile
        run: npm install --prefix frontend --no-audit --no-fund

      - name: Validate frontend clean install
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Commit regenerated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git commit -m "fix: sincronizar lockfiles OonCore 0.3.44"
          git push origin "HEAD:${GITHUB_REF_NAME}"
