name: sync-f5-docs

on:
  push:
    branches:
      - agent/f5-consume-integration-engine
    paths:
      - .github/workflows/sync-f5-docs.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/f5-consume-integration-engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install published toolchain
        run: npm ci --no-audit --no-fund

      - name: Synchronize OonCore docs
        run: npm run ooncore:docs

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ooncore
          if git diff --cached --quiet; then
            echo "Documentação já estava sincronizada."
            exit 0
          fi
          git commit -m "docs(v2): sincronizar documentação OonCore 0.3.57"
          git push origin HEAD:agent/f5-consume-integration-engine
